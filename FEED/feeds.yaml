# ============================================================
# feeds.yaml — fontes RSS do curso ADINT 2026
#
# Organizado pela NARRATIVA da aula: CVEs e Vazamentos sao o CONTRAPONTO
# PUBLICO das fontes do submundo (Telegram).
#   - Fonte publica  -> diz que a FALHA existe (CVE) / que o vazamento ja e publico
#   - Fonte Telegram -> diz que alguem ja esta USANDO / VENDENDO
# O cruzamento das duas vira o "relatorio de exposicao".
#
# ------------------------------------------------------------
# TESTADO EM 03/11/2026. Criterio: HTTP 200 **e** >= 1 entrada lida
# pelo feedparser. So HTTP 200 nao basta — ver MSRC e Avast no fim.
#
#   57 URLs testadas (as 19 daqui + as 38 do OPML publico do slide)
#   38 vivas  |  19 mortas
#   Este arquivo ficou com 40 fontes vivas, em 7 categorias.
#
# Para reconferir antes da aula:
#   python3 FEED/rss_feed.py collect --feeds-file FEED/feeds.yaml --days 2
#   (ou o script de teste em C:\ADINT\samples\, se preferir so o status)
# ------------------------------------------------------------
#
# ATENCAO AO VOLUME: o teto e RSS_MAX_ENTRIES (default 100 por feed).
# Com 40 fontes, uma coleta completa passou de ~2.660 itens em 03/11.
# Em JSON cru isso da ~303 mil tokens. Ver a licao de token no fim.
# ============================================================

