# ============================================================
# FONTES MORTAS / BLOQUEADAS — nao sao feeds; sao LICAO DE AULA.
# Testadas em 03/11/2026. Agrupadas pelo TIPO de morte, que e o
# que interessa ensinar: cada tipo exige uma resposta diferente.
#
# ------------------------------------------------------------
# TIPO 1 — HTTP 403: o WAF te barra. 8 feeds, a categoria Threat
#          Intel INTEIRA. NAO se resolve trocando User-Agent
#          (testado: navegador tambem toma 403).
#   https://www.cisa.gov/cybersecurity-advisories/all.xml
#   https://www.cisa.gov/cybersecurity-advisories/ics-advisories.xml
#   https://www.cisa.gov/cybersecurity-advisories/ics-medical-advisories.xml
#   https://www.cisa.gov/ncas/current-activity.xml
#   https://www.cisa.gov/ncas/alerts.xml
#   https://www.cisa.gov/ncas/analysis-reports.xml
#   https://www.cisa.gov/uscert/ncas/alerts.xml
#   https://euvsdisinfo.eu/category/blog/feed/
#   -> resposta: API oficial, ou outra saida de rede. Nao insista no RSS.
#
# ------------------------------------------------------------
# TIPO 2 — HTTP 404: o endpoint mudou. 6 feeds. O site esta vivo,
#          o RSS e que saiu do ar ou mudou de lugar.
#   https://nvd.nist.gov/feeds/xml/cve/misc/nvd-rss.xml   (NIST APOSENTOU o RSS)
#   https://abuse.ch/feed/
#   https://www.elastic.co/security-labs/feed/
#   https://www.proofpoint.com/us/blog/feed
#   https://www.scmagazine.com/feed/topic/threats
#   https://holdsecurity.com/index.xml
#   -> resposta: procurar o novo endereco, ou trocar de fonte.
#
# ------------------------------------------------------------
# TIPO 3 — HTTP 200 com ZERO entradas. 3 feeds. ESTE E O PIOR,
#          porque o coletor diz "OK" e nao traz nada. Se voce so
#          olha o status code, ele passa despercebido para sempre.
#   https://msrc.microsoft.com/blog/feed/      XML malformado (linha 125)
#   https://decoded.avast.io/feed/             200, 0 entradas
#   https://thecyberwire.com/feeds/rss.xml     XML malformado (linha 2)
#   -> resposta: validar CONTAGEM DE ENTRADAS, nunca so o status.
#
# ------------------------------------------------------------
# TIPO 4 — conexao recusada / DNS. 2 feeds.
#   https://publicintelligence.net/feed/
#   https://cybersecuritynews.com/feed/
#   -> resposta: pode ser temporario. Reteste antes de remover.
#
# ------------------------------------------------------------
# NAO E RSS, mas vale um coletor proprio:
#   CISA KEV (Known Exploited Vulns) -> 200, em JSON. E a fonte PREMIUM
#   de CVE: so o que esta sendo ATIVAMENTE explorado.
#   https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
#
#   NVD API 2.0 (substituiu o RSS aposentado):
#   https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=5
# ============================================================
